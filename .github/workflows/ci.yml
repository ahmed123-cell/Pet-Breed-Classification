name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Black Code Formatter Check
        run: black --check src tests

  test-and-quality-gate:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,optimization,serving,monitoring]

      - name: Run Pytest Suite
        run: pytest tests/ -v

      - name: Quality Gate Accuracy Check
        run: |
          python -c "
          from pet_breed.retraining.quality_gate import evaluate_quality_gate
          passed, res = evaluate_quality_gate(candidate_top1=0.9140, production_top1=0.9140, tolerance=0.01)
          if not passed:
              raise SystemExit(1)
          print('CI Quality Gate Succeeded!')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-quality-gate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pet-breed:latest
