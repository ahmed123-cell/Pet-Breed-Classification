[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-breed-classification"
version = "0.1.0"
description = "Production Computer Vision MLOps System for Pet Breed Classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pillow>=9.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.5.0",
    "prometheus-client>=0.17.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "black>=23.7.0"
]
optimization = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "openvino>=2023.1.0"
]
serving = [
    "bentoml>=1.1.0",
    "locust>=2.15.0"
]
monitoring = [
    "evidently>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
