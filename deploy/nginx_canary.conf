events {
    worker_connections 1024;
}

http {
    upstream pet_breed_backends {
        # Production Model (v1.0.0): 95% traffic weight
        server api_prod:8000 weight=95 max_fails=3 fail_timeout=10s;
        
        # Canary Candidate Model (v1.1.0): 5% traffic weight
        server api_canary:8000 weight=5 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://pet_breed_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://pet_breed_backends/health;
        }

        location /metrics {
            proxy_pass http://pet_breed_backends/metrics;
        }
    }
}
